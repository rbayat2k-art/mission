name: Android debug verification

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Lint, unit test and assemble local-backend debug APK
        working-directory: android
        run: gradle --no-daemon -PtapraDebugBackendUrl=http://10.0.2.2:3000 :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify debug manifest and checksum
        working-directory: android
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -q "package: name='ir.taprasystem.employee'" apk-badging.txt
          grep -q "sdkVersion:'23'" apk-badging.txt
          cp "$apk" tapra-employee-ci-debug.apk
          sha256sum tapra-employee-ci-debug.apk > tapra-employee-ci-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tapra-employee-ci-debug-${{ github.sha }}
          path: |
            android/tapra-employee-ci-debug.apk
            android/tapra-employee-ci-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 35]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: tapra_ci_root
          MARIADB_DATABASE: tapra_android_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: tapra_android_ci
      DB_USER: root
      DB_PASSWORD: tapra_ci_root
      AUTO_MIGRATE: "false"
      INITIAL_ADMIN_PASSWORD: tapra-ci-admin-password
      HOSTNAME: 0.0.0.0
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate && npm run build
      - name: Start ephemeral web backend
        run: |
          nohup npm start > /tmp/tapra-android-backend.log 2>&1 &
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:3000/api/health && exit 0; sleep 2; done
          cat /tmp/tapra-android-backend.log
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: tapra-employee-ci-debug-${{ github.sha }}
          path: apk
      - run: sudo chmod 666 /dev/kvm
      - name: Install and launch against the ephemeral backend
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apk/tapra-employee-ci-debug.apk
            adb shell pm grant ir.taprasystem.employee android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant ir.taprasystem.employee android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n ir.taprasystem.employee/.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/tapra-battery-gate.xml
            adb pull /sdcard/tapra-battery-gate.xml tapra-battery-gate-api-${{ matrix.api-level }}.xml
            grep -q "تنظیم باتری برای ورود الزامی است" tapra-battery-gate-api-${{ matrix.api-level }}.xml
            adb shell dumpsys deviceidle whitelist +ir.taprasystem.employee
            adb shell am force-stop ir.taprasystem.employee
            adb shell am start -W -n ir.taprasystem.employee/.MainActivity
            sleep 15
            adb logcat -d -t 800 > android-logcat-api-${{ matrix.api-level }}.txt
            if grep -A 20 "FATAL EXCEPTION" android-logcat-api-${{ matrix.api-level }}.txt | grep -q "ir.taprasystem.employee"; then cat android-logcat-api-${{ matrix.api-level }}.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -q "ir.taprasystem.employee/.MainActivity"
            adb shell uiautomator dump /sdcard/tapra-ui.xml
            adb pull /sdcard/tapra-ui.xml tapra-ui-api-${{ matrix.api-level }}.xml
            if grep -Eq "صفحه سامانه بارگذاری نشد|در حال بازکردن راهکار" tapra-ui-api-${{ matrix.api-level }}.xml; then cat tapra-ui-api-${{ matrix.api-level }}.xml; exit 1; fi

# This workflow deliberately produces only a short-lived debug verification
# artifact. Stable production signing and release publication are separate,
# manually authorized processes and require no repository signing secret here.
