name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/android-app-v1"
    paths:
      - "android/**"
      - "app/page.tsx"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  web-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate web application
        run: npm run lint && npm test && npm audit --audit-level=moderate

  build:
    needs: web-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate and build debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee android-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              lint_summary=$(grep -E "Error:|Warning:" app/build/reports/lint-results-debug.txt | head -n 15 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error title=Android lint report::$lint_summary"
            fi
            summary=$(grep -E "error:|FAILURE:|What went wrong|Execution failed|A failure occurred|Could not|failed" android-build.log | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Android build failed::$summary"
            exit "$build_status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tapra-employee-android-v1.0.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
