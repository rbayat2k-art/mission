# EXAMPLE ONLY. This file is deliberately invalid until every placeholder is
# replaced from the CDN provider's current official documentation.
# Do not guess CIDRs and do not enable this template on the origin as-is.

# Repeat this directive for EVERY official CDN proxy range:
set_real_ip_from <OFFICIAL_CDN_PROXY_CIDR>;
real_ip_header <OFFICIAL_CDN_CLIENT_IP_HEADER>;
real_ip_recursive on;

server {
    listen 80;
    server_name <PUBLIC_HOSTNAME>;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # $remote_addr is safe here only after all placeholders above use the
        # provider's complete official trust configuration.
        proxy_set_header X-Tapra-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }
}
