server {
    listen 80;
    server_name taprasystem.ir www.taprasystem.ir;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The CDN trust boundary is not confirmed. Keep the optional IP throttle
        # bucket disabled until official proxy CIDRs and its IP header are set.
        proxy_set_header X-Tapra-Client-IP "";
        # Never preserve a client-supplied X-Forwarded-For chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }
}
