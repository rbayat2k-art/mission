plugins {
    id 'com.android.application'
}

def productionBackendUrl = providers.gradleProperty('tapraBackendUrl')
    .orElse(providers.environmentVariable('TAPRA_BACKEND_URL'))
    .orElse('https://taprasystem.ir')
    .get()
def debugBackendUrl = providers.gradleProperty('tapraDebugBackendUrl')
    .orElse(providers.environmentVariable('TAPRA_DEBUG_BACKEND_URL'))
    .orElse(productionBackendUrl)
    .get()

// A release handed to employees must never silently target a local/test server.
// Local fixtures use the separate debug-only setting above.
if (productionBackendUrl != 'https://taprasystem.ir') {
    throw new GradleException('Release backend must be https://taprasystem.ir; use tapraDebugBackendUrl for local testing.')
}
def javaString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'ir.taprasystem.employee'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'ir.taprasystem.employee'
        minSdk 23
        targetSdk 35
        // Keep the approved upgrade number. Old release-tag suffixes were run IDs.
        versionCode 23
        versionName '1.2.4'
        buildConfigField 'String', 'BASE_URL', javaString(productionBackendUrl)
        manifestPlaceholders = [usesCleartextTraffic: 'false']
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'BASE_URL', javaString(debugBackendUrl)
            manifestPlaceholders = [usesCleartextTraffic: debugBackendUrl.startsWith('http://') ? 'true' : 'false']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
